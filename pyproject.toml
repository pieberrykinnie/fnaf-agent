[project]
name = "fnaf-agent"
version = "0.1.0"
description = "AI agent that plays FNAF 1 via computer vision"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "opencv-python>=5.0.0.93",
    "numpy",
    "mss",
    "pydirectinput",
    "pygetwindow",
    "pyyaml",
    "bettercam>=1.0.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.9.0",
    "gymnasium",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnaf_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
